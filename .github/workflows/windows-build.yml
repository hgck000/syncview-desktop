name: Windows .exe build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # QUAN TRỌNG: cho phép cập nhật Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install FE deps & build
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Create venv & install BE deps
        shell: pwsh
        run: |
          py -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip wheel setuptools
          .\.venv\Scripts\pip install -r backend/requirements.txt
          .\.venv\Scripts\pip install pyinstaller

      - name: PyInstaller .exe
        shell: pwsh
        env: { PYTHONWARNINGS: ignore }
        run: |
          .\.venv\Scripts\pyinstaller `
            --windowed `
            --noconsole `
            --name SyncView `
            --add-data "frontend\dist;frontend/dist" `
            --hidden-import h11 `
            --collect-submodules uvicorn `
            --collect-submodules anyio `
            backend\run_prod.py
          # Output: dist\SyncView\SyncView.exe

      # (tuỳ chọn) build Inno Setup vào installer\Output\SyncView-Setup.exe

      - name: Attach to GitHub Release (append)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SyncView/SyncView.exe
            installer/Output/**/*.exe
          append_body: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
