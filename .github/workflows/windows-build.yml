name: Windows .exe build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FE deps & build
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Create venv & install BE deps
        shell: pwsh
        run: |
          py -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip wheel setuptools
          .\.venv\Scripts\pip install -r backend/requirements.txt
          .\.venv\Scripts\pip install pyinstaller

      - name: PyInstaller .exe
        shell: pwsh
        env: { PYTHONWARNINGS: ignore }
        run: |
          .\.venv\Scripts\pyinstaller `
            --windowed `
            --noconsole `
            --name SyncView `
            --add-data "frontend\dist;frontend/dist" `
            --hidden-import h11 `
            --collect-submodules uvicorn `
            --collect-submodules anyio `
            backend\run_prod.py
          # Output: dist\SyncView\SyncView.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncView-Windows-x64
          path: |
            dist\**\SyncView.exe
            installer\Output\**\*.exe
          if-no-files-found: warn

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SyncView-Windows-x64/SyncView.exe
            artifacts/SyncView-Windows-x64/*.exe
          generate_release_notes: true
