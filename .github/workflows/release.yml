name: Release (macOS + Windows) — single release job

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag để attach assets (ví dụ: v1.0.3). BẮT BUỘC khi chạy tay."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- macOS (arm64 + x86_64) ----------
  build-mac:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: FE build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: BE deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip wheel setuptools
          pip install -r backend/requirements.txt
          pip install pyinstaller pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-WebKit pyobjc-framework-security

      - name: Build macOS icon (.icns) from PNG
        run: |
          set -e
          SRC="assets/SyncView.png"
          if [ ! -f "$SRC" ]; then
            echo "Missing $SRC"
            exit 1
          fi

          rm -rf SyncView.iconset SyncView.icns
          mkdir -p SyncView.iconset

          sips -z 16 16     "$SRC" --out SyncView.iconset/icon_16x16.png
          sips -z 32 32     "$SRC" --out SyncView.iconset/icon_16x16@2x.png
          sips -z 32 32     "$SRC" --out SyncView.iconset/icon_32x32.png
          sips -z 64 64     "$SRC" --out SyncView.iconset/icon_32x32@2x.png
          sips -z 128 128   "$SRC" --out SyncView.iconset/icon_128x128.png
          sips -z 256 256   "$SRC" --out SyncView.iconset/icon_128x128@2x.png
          sips -z 256 256   "$SRC" --out SyncView.iconset/icon_256x256.png
          sips -z 512 512   "$SRC" --out SyncView.iconset/icon_256x256@2x.png
          sips -z 512 512   "$SRC" --out SyncView.iconset/icon_512x512.png
          sips -z 1024 1024 "$SRC" --out SyncView.iconset/icon_512x512@2x.png

          iconutil -c icns SyncView.iconset -o SyncView.icns
          rm -rf SyncView.iconset
          ls -lh SyncView.icns

      - name: PyInstaller .app
        env: { PYTHONWARNINGS: ignore }
        run: |
          source .venv/bin/activate
          pyinstaller \
            --windowed \
            --onedir \
            --name SyncView \
            --icon SyncView.icns \
            --add-data "frontend/dist:frontend/dist" \
            --hidden-import h11 \
            --collect-submodules uvicorn \
            --collect-submodules anyio \
            backend/run_prod.py

      - name: Make DMG
        run: |
          set -e
          cd dist
          mv "SyncView.app" "SyncView-${{ matrix.arch }}.app"
          hdiutil create -volname "SyncView" \
            -srcfolder "SyncView-${{ matrix.arch }}.app" \
            -ov -format UDZO "SyncView-mac-${{ matrix.arch }}.dmg"

      - name: Upload mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncView-mac-${{ matrix.arch }}
          path: dist/SyncView-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 5

  # ---------- Windows (x64) ----------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: FE build
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: BE deps
        shell: pwsh
        run: |
          py -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip wheel setuptools
          .\.venv\Scripts\pip install -r backend/requirements.txt
          .\.venv\Scripts\pip install pyinstaller

      - name: PyInstaller .exe
        shell: pwsh
        env: { PYTHONWARNINGS: ignore }
        run: |
          .\.venv\Scripts\pyinstaller `
            --windowed `
            --noconsole `
            --name SyncView `
            --add-data "frontend\dist;frontend/dist" `
            --hidden-import h11 `
            --collect-submodules uvicorn `
            --collect-submodules anyio `
            backend\run_prod.py
          # In cây dist để debug đường dẫn khi cần
          Get-ChildItem -Recurse dist | Select-Object FullName, Length
          if (!(Test-Path "dist\SyncView\SyncView.exe")) {
            throw "Missing dist\SyncView\SyncView.exe"
          }

      - name: Upload win artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncView-Windows-x64
          path: |
            dist\SyncView\SyncView.exe
            installer\Output\**\*.exe
          if-no-files-found: error
          retention-days: 5

  # ---------- Publish single Release (needs cả 2 build) ----------
  release:
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows]
    if: ${{ github.ref_type == 'tag' || inputs.tag_name != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded artifacts (debug)
        run: |
          ls -R ./artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: |
            artifacts/SyncView-mac-arm64/SyncView-mac-arm64.dmg
            artifacts/SyncView-mac-x86_64/SyncView-mac-x86_64.dmg
            artifacts/SyncView-Windows-x64/**/SyncView.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
