name: Release (macOS + Windows) — single release job

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag để attach assets (ví dụ: vx.y.z). BẮT BUỘC khi chạy tay."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- macOS (arm64 + x86_64) ----------
  build-mac:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: FE build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: BE deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip wheel setuptools
          pip install -r backend/requirements.txt
          pip install pyinstaller pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-WebKit pyobjc-framework-security
          python -m unittest discover -s backend/tests -v

      - name: Build macOS icon (.icns) from PNG
        run: |
          set -e
          SRC="assets/syncview-icon.png"
          if [ ! -f "$SRC" ]; then
            echo "Missing $SRC"
            exit 1
          fi

          rm -rf SyncView.iconset SyncView.icns
          mkdir -p SyncView.iconset

          sips -z 16 16     "$SRC" --out SyncView.iconset/icon_16x16.png
          sips -z 32 32     "$SRC" --out SyncView.iconset/icon_16x16@2x.png
          sips -z 32 32     "$SRC" --out SyncView.iconset/icon_32x32.png
          sips -z 64 64     "$SRC" --out SyncView.iconset/icon_32x32@2x.png
          sips -z 128 128   "$SRC" --out SyncView.iconset/icon_128x128.png
          sips -z 256 256   "$SRC" --out SyncView.iconset/icon_128x128@2x.png
          sips -z 256 256   "$SRC" --out SyncView.iconset/icon_256x256.png
          sips -z 512 512   "$SRC" --out SyncView.iconset/icon_256x256@2x.png
          sips -z 512 512   "$SRC" --out SyncView.iconset/icon_512x512.png
          sips -z 1024 1024 "$SRC" --out SyncView.iconset/icon_512x512@2x.png

          iconutil -c icns SyncView.iconset -o SyncView.icns
          rm -rf SyncView.iconset
          ls -lh SyncView.icns

      - name: PyInstaller .app
        env: { PYTHONWARNINGS: ignore }
        run: |
          source .venv/bin/activate
          pyinstaller \
            --windowed \
            --onedir \
            --name SyncView \
            --icon SyncView.icns \
            --add-data "frontend/dist:frontend/dist" \
            --hidden-import h11 \
            --collect-all uvicorn \
            --collect-all pillow_heif \
            --collect-submodules anyio \
            backend/run_prod.py

      - name: Make DMG
        run: |
          set -euo pipefail
          cd dist

          APP="SyncView-${{ matrix.arch }}.app"
          DMG="SyncView-mac-${{ matrix.arch }}.dmg"

          # clean outputs
          rm -f "$DMG"
          rm -rf "_dmg_stage" "$APP"

          # rename output app (PyInstaller produces SyncView.app)
          mv "SyncView.app" "$APP"

          # detach stale mounts if any
          if hdiutil info | grep -q "/Volumes/SyncView"; then
            DEV=$(hdiutil info | awk '/\/Volumes\/SyncView/{print $1; exit}')
            hdiutil detach "$DEV" || hdiutil detach -force "$DEV" || true
          fi

          # stage copy to avoid "resource busy" on freshly-built bundle
          mkdir -p _dmg_stage
          ditto "$APP" "_dmg_stage/$APP"

          # retry create
          for i in 1 2 3; do
            hdiutil create -volname "SyncView" \
              -srcfolder "_dmg_stage/$APP" \
              -ov -format UDZO "$DMG" && break
            echo "hdiutil create failed (attempt $i). retrying..."
            sleep 3
          done

          test -f "$DMG"

      - name: Upload mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncView-mac-${{ matrix.arch }}
          path: dist/SyncView-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 5

  # ---------- Windows (x64) ----------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: FE build
        shell: pwsh
        working-directory: frontend
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          npm ci
          npm run type-check
          npm run lint
          npm run build

      - name: BE deps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          # Dùng đúng Python 3.11 do actions/setup-python cung cấp.
          python -m venv .venv

          $venvVersion = .\.venv\Scripts\python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($venvVersion -ne "3.11") {
            throw "Expected Python 3.11, got $venvVersion"
          }

          .\.venv\Scripts\python -m pip install --upgrade pip wheel setuptools
          .\.venv\Scripts\python -m pip install -r backend/requirements.txt
          .\.venv\Scripts\python -m pip install pyinstaller
          .\.venv\Scripts\python -m pip check

          # Xác nhận các module quan trọng thực sự đã cài.
          .\.venv\Scripts\python -c "import fastapi, uvicorn, webview, h11, clr, pillow_heif; print('Backend imports OK')"
          .\.venv\Scripts\python -m unittest discover -s backend/tests -v

      - name: PyInstaller .exe
        shell: pwsh
        env:
          PYTHONWARNINGS: ignore
          SYNCVIEW_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || '0.0.0' }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          .\.venv\Scripts\pyinstaller --clean --noconfirm SyncView.spec

          Get-ChildItem -Recurse dist | Select-Object FullName, Length
          $requiredFiles = @(
            "dist\SyncView\SyncView.exe",
            "dist\SyncView\_internal\frontend\dist\index.html"
          )
          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Missing packaged file: $file"
            }
          }
          $versionInfo = (Get-Item "dist\SyncView\SyncView.exe").VersionInfo
          if ($versionInfo.CompanyName -ne "hgck000" -or $versionInfo.ProductName -ne "SyncView") {
            throw "SyncView.exe is missing publisher/product metadata"
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          choco install innosetup -y

          # Lấy version từ tag v2.1.0 -> 2.1.0 (khi chạy tag) hoặc từ inputs.tag_name (khi workflow_dispatch)
          $tag = "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}"
          $ver = $tag.TrimStart('v')
          echo "Tag=$tag  Version=$ver"

          # Không để installer cũ đã commit trong Output lọt vào artifact mới.
          Remove-Item -Recurse -Force .\Output -ErrorAction SilentlyContinue

          # Nhúng WebView2 Evergreen Bootstrapper chính thức. Máy đã có
          # WebView2 sẽ bỏ qua nhanh; máy chưa có sẽ tải runtime khi cài app.
          $webViewBootstrapper = ".\assets\MicrosoftEdgeWebView2Setup.exe"
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile $webViewBootstrapper
          if (!(Test-Path $webViewBootstrapper)) {
            throw "Missing WebView2 bootstrapper"
          }
          $webViewSignature = Get-AuthenticodeSignature $webViewBootstrapper
          if ($webViewSignature.Status -ne "Valid") {
            throw "WebView2 bootstrapper signature is not valid: $($webViewSignature.Status)"
          }

          # Build installer, truyền define vào installer.iss
          iscc /DMyAppVersion=$ver .\installer.iss

          # Chỉ chấp nhận đúng installer của version đang phát hành.
          Get-ChildItem -Recurse .\Output | Select-Object FullName, Length
          $setup = ".\Output\SyncView-$ver-Setup.exe"
          if (!(Test-Path $setup)) {
            throw "Missing $setup"
          }

          # Bản portable: giải nén rồi chạy SyncView.exe, không cần cài đặt.
          # Nén nội dung bên trong thư mục để SyncView.exe nằm ngay ở gốc ZIP.
          $portable = ".\Output\SyncView-$tag-win64.zip"
          Compress-Archive `
            -Path ".\dist\SyncView\*" `
            -DestinationPath $portable `
            -CompressionLevel Optimal `
            -Force
          if (!(Test-Path $portable)) {
            throw "Missing $portable"
          }

      - name: Smoke-test installer and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}"
          $ver = $tag.TrimStart('v')
          $setup = (Resolve-Path ".\Output\SyncView-$ver-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "SyncView-Smoke"

          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          $install = Start-Process `
            -FilePath $setup `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/TASKS=", "/DIR=$installDir" `
            -Wait `
            -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)"
          }

          $installedExe = Join-Path $installDir "SyncView.exe"
          $installedFrontend = Join-Path $installDir "_internal\frontend\dist\index.html"
          $uninstaller = Get-ChildItem $installDir -Filter "unins*.exe" | Select-Object -First 1
          $webViewData = Join-Path $env:LOCALAPPDATA "SyncView\WebView2"
          $forbiddenInstallData = "$($installedExe).WebView2"
          if (!(Test-Path $installedExe) -or !(Test-Path $installedFrontend) -or !$uninstaller) {
            throw "Installed app is incomplete or has no uninstaller"
          }

          Remove-Item -Recurse -Force $webViewData -ErrorAction SilentlyContinue

          # Start the packaged app and verify its bundled backend/frontend.
          $app = Start-Process -FilePath $installedExe -PassThru
          $ready = $false
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline -and !$ready) {
              if ($app.HasExited) {
                throw "Packaged app exited during startup with code $($app.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:5174/" -UseBasicParsing -TimeoutSec 2
                $ready = $response.StatusCode -eq 200
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (!$ready) {
              throw "Packaged app did not serve its frontend within 30 seconds"
            }

            # A Program Files installation must keep WebView2 browser data in a
            # writable per-user folder, never beside SyncView.exe.
            $webViewReady = $false
            $webViewDeadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $webViewDeadline -and !$webViewReady) {
              if (Test-Path $webViewData) {
                $webViewReady = @(Get-ChildItem $webViewData -Force -ErrorAction SilentlyContinue).Count -gt 0
              }
              if (!$webViewReady) {
                Start-Sleep -Milliseconds 500
              }
            }
            if (!$webViewReady) {
              throw "WebView2 did not initialize its per-user data folder"
            }
            if (Test-Path $forbiddenInstallData) {
              throw "WebView2 data was created beside the installed executable"
            }
          } finally {
            if (!$app.HasExited) {
              Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            }
          }

          $uninstall = Start-Process `
            -FilePath $uninstaller.FullName `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($uninstall.ExitCode)"
          }

      - name: Upload win artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncView-Windows-x64
          path: |
            Output\SyncView-*-Setup.exe
            Output\SyncView-v*-win64.zip
          if-no-files-found: error
          retention-days: 5
  # ---------- Publish single Release (needs cả 2 build) ----------
  release:
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows]
    if: ${{ github.ref_type == 'tag' || inputs.tag_name != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded artifacts (debug)
        run: |
          ls -R ./artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: |
            artifacts/SyncView-mac-arm64/SyncView-mac-arm64.dmg
            artifacts/SyncView-mac-x86_64/SyncView-mac-x86_64.dmg
            artifacts/SyncView-Windows-x64/SyncView-*-Setup.exe
            artifacts/SyncView-Windows-x64/SyncView-v*-win64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
