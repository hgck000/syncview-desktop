name: macOS .dmg build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-14   # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-13   # Intel (x86_64)
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FE deps & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Create venv & install BE deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip wheel setuptools
          pip install -r backend/requirements.txt
          # đảm bảo pyobjc trên mac
          pip install pyobjc-core pyobjc-framework-Cocoa
          pip install pyinstaller

      - name: PyInstaller onedir .app
        env:
          # để uvicorn/anyio import đầy đủ
          PYTHONWARNINGS: ignore
        run: |
          source .venv/bin/activate
          pyinstaller \
            --windowed \
            --onedir \
            --name SyncView \
            --add-data "frontend/dist:frontend/dist" \
            --hidden-import uvicorn \
            --collect-submodules uvicorn \
            --collect-submodules anyio \
            backend/run_prod.py
          # Kết quả: dist/SyncView/SyncView.app

      - name: Create DMG
        run: |
          cd dist
          # đặt tên theo kiến trúc
          mv SyncView "SyncView-${{ matrix.arch }}"
          hdiutil create -volname "SyncView" \
            -srcfolder "SyncView-${{ matrix.arch }}" \
            -ov -format UDZO "SyncView-mac-${{ matrix.arch }}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncView-mac-${{ matrix.arch }}
          path: dist/SyncView-mac-${{ matrix.arch }}.dmg

  # (Tùy chọn) Tạo GitHub Release và attach DMG khi push tag v*
  release:
    needs: build-mac
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SyncView-mac-arm64/SyncView-mac-arm64.dmg
            artifacts/SyncView-mac-x86_64/SyncView-mac-x86_64.dmg
